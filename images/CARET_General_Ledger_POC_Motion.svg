  <g fill="#172b38" font-family="Helvetica, Arial, sans-serif" font-size="32"><text x="124" y="618">CARET connects billing, payments, and accounting</text><text x="124" y="664">in one place, with a clear view of your finances.</text></g><title>Modernized General Ledger | Three workflows. One set of books.</title><style>
.stream { animation: trace 7s ease-in-out 1 both; }
