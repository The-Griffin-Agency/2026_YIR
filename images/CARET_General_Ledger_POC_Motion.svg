.stream, .label, .row { animation-fill-mode:both; }
@keyframes label-in { 0% {opacity:0} 8%,83% {opacity:1} 90%,100% {opacity:0} }
@keyframes trace { 0%,14% {stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0} 15% {opacity:1} 39%,83% {stroke-dasharray:1 1;stroke-dashoffset:0;opacity:1} 90%,100% {stroke-dashoffset:0;opacity:0} }
@keyframes book-in { 0%,34%,100% {opacity:0} 44%,92% {opacity:1} }
@keyframes row-in { 0%,45%,100% {opacity:0;transform:translateX(-8px)} 53%,82% {opacity:1;transform:translateX(0)} 89% {opacity:0} }
