  <g id="supporting-copy" fill="#172b38" font-family="Helvetica, Arial, sans-serif" font-size="32" class="command-copy"><text x="1154" y="676">See billing and timekeeping across your firm.</text><text x="1154" y="728">Follow up right from Command.</text></g><title>CARET Command | See the whole firm. Know where to act.</title><style>
.dot-white { animation: white-in 7s 1 both; }
