<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, Helvetica, DejaVu Sans, sans-serif"><title>CARET Court Rules — Court dates move. CARET does the math.</title><desc>A hearing moves from Tuesday to Thursday. Two selected deadline markers update, while a separate event stays put. The calendar is illustrative.</desc><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#a8f0c9" /><circle cx="1440" cy="538" r="368" fill="#86ddb8"/><g id="copy"><text x="124" y="322" font-size="26" font-weight="700" fill="#172b38" letter-spacing="3">CARET COURT RULES</text><text x="120" y="429" font-size="69" font-weight="700" fill="#172b38" letter-spacing="-3">Court dates move.</text><text x="120" y="525" font-size="69" font-weight="700" fill="#172b38" letter-spacing="-3">CARET does the math.</text><text x="125" y="616" font-size="30" font-weight="400" fill="#172b38" >CARET calculates the related deadlines</text><text x="125" y="667" font-size="30" font-weight="400" fill="#172b38" >and recalculates them when the date changes.</text></g><g id="calendar"><rect x="941" y="272" width="846" height="537" rx="26" fill="#fffaf0" /><rect x="941" y="272" width="846" height="90" rx="26" fill="#172b38" /><rect x="941" y="331" width="846" height="31" rx="0" fill="#172b38" /><path d="M1080 251v43m565-43v43" fill="none" stroke="#172b38" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><path d="M1080 277v17m565-17v17" fill="none" stroke="#a8f0c9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><text x="1025.6" y="414" font-size="21" font-weight="700" fill="#172b38" text-anchor="middle" letter-spacing="2">MON</text><path d="M1110.2 362v428" fill="none" stroke="#D8E3DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="1194.8" y="414" font-size="21" font-weight="700" fill="#172b38" text-anchor="middle" letter-spacing="2">TUE</text><path d="M1279.4 362v428" fill="none" stroke="#D8E3DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="1364.0" y="414" font-size="21" font-weight="700" fill="#172b38" text-anchor="middle" letter-spacing="2">WED</text><path d="M1448.6 362v428" fill="none" stroke="#D8E3DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="1533.1999999999998" y="414" font-size="21" font-weight="700" fill="#172b38" text-anchor="middle" letter-spacing="2">THU</text><path d="M1617.8 362v428" fill="none" stroke="#D8E3DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="1702.3999999999999" y="414" font-size="21" font-weight="700" fill="#172b38" text-anchor="middle" letter-spacing="2">FRI</text><path d="M942 442h844m-844 140h844m-844 107h844" fill="none" stroke="#D8E3DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g id="date-change-arrow"><rect x="1125" y="476" width="140" height="56" rx="12" fill="none" stroke="#557B70" stroke-width="3" stroke-dasharray="8 6"/><path d="M1280 505h162m-15-13 15 13-15 13" fill="none" stroke="#4b36a7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g id="hearing"><rect x="1463" y="476" width="140" height="56" rx="12" fill="#172b38" /><text x="1533" y="512" font-size="24" font-weight="700" fill="#a8f0c9" text-anchor="middle">Hearing</text></g><g id="related-deadlines"><path d="M1533 540v74h169v26m-169-26h-169v26" fill="none" stroke="#4b36a7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="1315" y="640" width="98" height="36" rx="10" fill="#DED4FF" /><circle cx="1334" cy="658" r="5" fill="#4b36a7"/><path d="M1347 658h47" fill="none" stroke="#4b36a7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="1653" y="640" width="98" height="36" rx="10" fill="#DED4FF" /><circle cx="1672" cy="658" r="5" fill="#4b36a7"/><path d="M1685 658h47" fill="none" stroke="#4b36a7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g id="unchanged-event"><rect x="966" y="720" width="120" height="42" rx="10" fill="#E2E8E3" /><text x="1026" y="747" font-size="16" font-weight="700" fill="#455D63" text-anchor="middle">Unchanged</text></g></svg>